# The iPhone app's Xcode project: `xcodegen generate` in ios/ writes RichiRoute.xcodeproj (outside git).
# Before building, `npm run ios:map` writes RichiRoute/Map/ and `node scripts/build-ios-data.mjs` lays out Routing/ (bundled)
# and Data/ (copied once into the app's data container);
# the build compiles the routing engine (engine/ios) with cargo for the device or the simulator.
name: RichiRoute
options:
  bundleIdPrefix: com.adamn
  deploymentTarget:
    iOS: "18.0"
  # checked against this Xcode's recommended settings
  xcodeVersion: "27.2"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: 37885F35ZK
    CODE_SIGN_STYLE: Automatic

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  # Garmin's Connect IQ Mobile SDK (binary framework), under the Connect IQ SDK license agreement
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0

targets:
  RichiRoute:
    configFiles:
      Debug: RichiRoute.xcconfig
      Release: RichiRoute.xcconfig
    type: application
    platform: iOS
    sources:
      - path: RichiRoute
        excludes: [Map]
      # folders keep their layout in the bundle: the map's fonts share file names
      - path: RichiRoute/Map
        type: folder
        buildPhase: resources
      - path: Routing
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - package: ConnectIQ
      # without it, Xcode warns on every build that it found no App Intents to extract
      - sdk: AppIntents.framework
    info:
      path: RichiRoute/Info.plist
      properties:
        CFBundleDisplayName: RichiRoute
        GoogleMapsKey: $(GOOGLE_MAPS_KEY)
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # the app asks its own engine on 127.0.0.1
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: RichiRoute zeigt deinen Standort auf der Karte.
        NSBluetoothAlwaysUsageDescription: RichiRoute sendet Routen über Bluetooth an Garmin-Geräte.
        # Garmin Connect returns the chosen Edge to this scheme; the SDK checks for Garmin Connect by its own
        CFBundleURLTypes:
          - CFBundleURLName: com.adamn.RichiRoute.connectiq
            CFBundleURLSchemes: [richiroute-ciq]
        LSApplicationQueriesSchemes: [gcm-ciq]
        # GPX tracks and RichiRoute files open from Files, Mail, Messages and AirDrop, read where they lie
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX-Track
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
          - CFBundleTypeName: RichiRoute-Datei
            LSHandlerRank: Owner
            LSItemContentTypes: [com.adamn.richiroute]
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX-Track
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.adamn.richiroute
            UTTypeDescription: RichiRoute-Datei
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [richiroute]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: RichiRoute/RichiEngine.h
        # -ObjC: the Connect IQ SDK uses Objective-C categories
        OTHER_LDFLAGS: -ObjC -lrichi_ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(PROJECT_DIR)/../engine/target/aarch64-apple-ios/release
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(PROJECT_DIR)/../engine/target/aarch64-apple-ios-sim/release
        # cargo writes into engine/target, outside the build's sandbox
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # an iPhone app, upright only, which an iPad's split views would not allow
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets: [RichiRouteUITests]
    preBuildScripts:
      - name: Routing engine
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in iphonesimulator) target=aarch64-apple-ios-sim ;; *) target=aarch64-apple-ios ;; esac
          "$HOME/.cargo/bin/cargo" build --release --target "$target" -p richi-ios --manifest-path "$PROJECT_DIR/../engine/Cargo.toml"

  RichiRouteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RichiRouteUITests
        excludes: ["*.gpx"]
      # a GPX file is no resource by its type (Xcode simulates locations with it)
      - path: RichiRouteUITests/Testtrack.gpx
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RichiRoute
      - sdk: AppIntents.framework
